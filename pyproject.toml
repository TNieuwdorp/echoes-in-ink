[project]
name = "echoes-in-ink"
version = "0.1.0"
description = "Transcribe, enrich and explore a family archive of handwritten Dutch letters (1945-1950)."
readme = "README.md"
authors = [{ name = "Thijs Nieuwdorp" }]
requires-python = ">=3.11"
dependencies = [
    "polars>=1.30",
    "pillow>=10.4",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pydantic>=2.8",
    "typer>=0.12",
    "rich>=13.7",
    "jiwer>=3.0",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
    "openai>=1.50",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyarrow>=17.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
echoes = "echoes.cli:app"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "echoes"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
